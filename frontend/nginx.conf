server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: fall back to index.html for client-side routes like /admin
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    location /menu {
        proxy_pass http://api:8000;
    }
    location /checkout {
        proxy_pass http://api:8000;
    }
    location /orders {
        proxy_pass http://api:8000;
    }
}
